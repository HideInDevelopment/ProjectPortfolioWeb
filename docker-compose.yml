services:
  postgres:
    image: postgres:17
    container_name: portfolio-web-postgres
    environment:
      POSTGRES_DB: portfolio_web
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - portfolio-web-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portfolio_web"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-web-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PortfolioWebDatabase: Host=postgres;Port=5432;Database=portfolio_web;Username=postgres;Password=${POSTGRES_PASSWORD}
      Database__ApplyMigrationsOnStartup: true
      Authentication__Issuer: ${AUTH_ISSUER}
      Authentication__Audience: ${AUTH_AUDIENCE}
      Authentication__SigningKey: ${AUTH_SIGNING_KEY}
      Authentication__ExpirationMinutes: ${AUTH_EXPIRATION_MINUTES}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  portfolio-web-postgres-data:
