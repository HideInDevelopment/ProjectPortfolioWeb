name: ci

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PortfolioWeb.sln

      - name: Build
        run: dotnet build PortfolioWeb.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test PortfolioWeb.sln --no-build --configuration Release
